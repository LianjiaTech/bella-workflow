name: Auto Deploy to Server

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (e.g., v1.0.0)'
        required: true
        type: string

env:
  REPO_NAME: bella-workflow
  DEPLOY_PATH: ~/bella

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        password: ${{ secrets.DEPLOY_PASSWORD }}
        port: ${{ secrets.DEPLOY_PORT }}
        script: |
          set -e
          
          echo "=== Bella Workflow Auto Deploy ==="
          
          # 获取要部署的标签
          if [[ "${{ github.event_name }}" == "release" ]]; then
            DEPLOY_TAG="${{ github.event.release.tag_name }}"
          else
            DEPLOY_TAG="${{ github.event.inputs.tag }}"
          fi
          
          echo "部署标签: $DEPLOY_TAG"
          
          # 创建部署目录
          mkdir -p ${{ env.DEPLOY_PATH }}
          cd ${{ env.DEPLOY_PATH }}
          
          # 停止现有服务（如果存在）
          echo "停止现有服务..."
          if [ -d "${{ env.REPO_NAME }}" ]; then
            cd ${{ env.REPO_NAME }}/docker
            docker-compose --env-file .bella-app.env -f docker-compose.app.yaml down || true
            cd ..
          fi
          
          # 备份现有版本
          if [ -d "${{ env.REPO_NAME }}" ]; then
            echo "备份现有版本..."
            mv ${{ env.REPO_NAME }} ${{ env.REPO_NAME }}_backup_$(date +%Y%m%d_%H%M%S)
          fi
          
          # 克隆最新代码
          echo "克隆代码: $DEPLOY_TAG"
          git clone --depth 1 --branch $DEPLOY_TAG https://github.com/Jiakaic/bella-workflow.git
          
          # 进入项目目录
          cd ${{ env.REPO_NAME }}/docker
          
          # 复制配置文件
          echo "配置环境变量..."
          cp .example-bella-app.env .bella-app.env
          
          # 替换OpenAPI配置
          echo "更新OpenAPI配置..."
          sed -i "s|BELLA_OPENAPI_HOST=.*|BELLA_OPENAPI_HOST=${{ secrets.BELLA_OPENAPI_HOST }}|g" .bella-app.env
          sed -i "s|BELLA_OPENAPI_BASE=.*|BELLA_OPENAPI_BASE=${{ secrets.BELLA_OPENAPI_BASE }}|g" .bella-app.env
          sed -i "s|BELLA_OPENAPI_URL=.*|BELLA_OPENAPI_URL=${{ secrets.BELLA_OPENAPI_URL }}|g" .bella-app.env
          sed -i "s|BELLA_SESSION_COOKIE_DOMAIN=.*|BELLA_SESSION_COOKIE_DOMAIN=${{ secrets.BELLA_SESSION_COOKIE_DOMAIN }}|g" .bella-app.env
          sed -i "s|BELLA_WORKFLOW_BACKEND_OUTER_URL=.*|BELLA_WORKFLOW_BACKEND_OUTER_URL=${{ secrets.BELLA_WORKFLOW_BACKEND_OUTER_URL }}|g" .bella-app.env
          
          # 启动中间件（如果还没有运行）
          echo "检查并启动中间件..."
          if ! docker network ls | grep -q "bella-infrastructure_bella-network"; then
            echo "启动中间件服务..."
            chmod +x deploy-middleware.sh
            cp .bella-app.env .env
            ./deploy-middleware.sh
          else
            echo "中间件已运行，跳过启动"
          fi
          
          # 启动应用服务
          echo "启动应用服务..."
          docker-compose --env-file .bella-app.env -f docker-compose.app.yaml up -d
          
          # 等待服务启动
          echo "等待服务启动..."
          sleep 30
          
          # 检查服务状态
          echo "检查服务状态..."
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          
          # 健康检查
          echo "进行健康检查..."
          
          # 检查API服务
          if curl -f -m 10 http://localhost:8080/actuator/health > /dev/null 2>&1; then
            echo "✅ API服务健康检查通过"
          else
            echo "❌ API服务健康检查失败"
            exit 1
          fi
          
          # 检查Web服务
          if curl -f -m 10 http://localhost:3000 > /dev/null 2>&1; then
            echo "✅ Web服务健康检查通过"
          else
            echo "❌ Web服务健康检查失败"
            exit 1
          fi
          
          echo "=== 部署完成 ==="
          echo "API服务: http://${{ secrets.DEPLOY_HOST }}:8080"
          echo "Web服务: http://${{ secrets.DEPLOY_HOST }}:3000"
          echo "部署版本: $DEPLOY_TAG"
          echo "部署时间: $(date)"
          
          # 清理旧的备份（保留最近5个）
          echo "清理旧备份..."
          cd ${{ env.DEPLOY_PATH }}
          ls -t | grep "bella-workflow_backup_" | tail -n +6 | xargs -r rm -rf
          
          echo "部署流程完成！"